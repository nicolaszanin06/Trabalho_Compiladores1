name: Testes do analisador e do backend C

on: [push, pull_request]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instalar Flex, Bison, GCC, Make e libfl
        run: sudo apt-get update && sudo apt-get install -y flex bison gcc make libfl-dev
      - name: Regenerar e compilar o compilador
        run: make -B -C src
      - name: Testar o analisador e a IR
        run: python testes/test_analisador.py --regenerate
      - name: Testar a geração final de C
        run: python testes/test_gerador_c.py
