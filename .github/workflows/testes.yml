name: Testes do analisador

on: [push, pull_request]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instalar Flex, Bison e GCC
        run: sudo apt-get update && sudo apt-get install -y flex bison gcc
      - name: Regenerar e testar o analisador
        run: python testes/test_analisador.py --regenerate
